[project]
name = "torchsweetie"
requires-python = ">=3.14"
authors = [{ name = "Tianhong Liang", email = "lngtnhng97@gmail.com" }]
description = "A tiny framework based on PyTorch for helping train models like your sweetie."
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
  "accelerate",
  "faster-coco-eval",
  "natsort",
  "numpy",
  "omegaconf",
  "opencv-python-headless",
  "pandas",
  "pillow",
  "pypinyin",
  "pyyaml",
  "rich",
  "scikit-learn",
  "scipy",
  "torch",
  "torchmetrics",
  "torchvision",
  "tqdm",
]

[project.optional-dependencies]
all = [
  "cleanlab",
  "matplotlib",
  "nvidia-modelopt[onnx]",
  "onnx",
  "onnxscript",
  "onnxslim",
  "requests",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "torchsweetie.__version__" }

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
